name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Bun
        run: bun --version

      - name: Run tests
        run: npm test

      - name: Check module limits
        run: npm run check:module-limits

      - name: Run coverage on Linux Node 24
        if: runner.os == 'Linux' && matrix.node == 24
        run: npm run test:coverage -- "origin/${GITHUB_BASE_REF:-main}"

      - name: Pack and smoke-test installed package
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          mkdir "$root/pack" "$root/install" "$root/target"
          npm pack --pack-destination "$root/pack" >/dev/null
          archive=$(find "$root/pack" -name '*.tgz' -print -quit)
          npm install --prefix "$root/install" --no-save "$archive" >/dev/null
          bin="$root/install/node_modules/.bin/repo-pattern"
          (cd "$RUNNER_TEMP" && "$bin" --help >/dev/null)
          version=$(cd "$RUNNER_TEMP" && "$bin" --version)
          test "$version" = "repo-pattern 1.2.3"
          (cd "$RUNNER_TEMP" && "$bin" setup --target "$root/target" --setup-pipeline none --yes >/dev/null)
          test -f "$root/target/.claude/settings.json"
          test -f "$root/target/.mcp.json"
          test -f "$root/target/.repo-pattern/.repo-pattern.lock.json"
          if tar -tzf "$archive" | grep -E '/(test|fixtures|plans|self-check|phase-1-baseline|\.github/workflows)/|(^|/)scripts/(test|self-check)' ; then
            echo 'development files found in package archive' >&2
            exit 1
          fi

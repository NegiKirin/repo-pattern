schema: spec-driven

context: |
  Project: <short project description>.
  Runtime: <language, framework, and runtime>.
  Package/dependency workflow: <npm | pnpm | yarn | uv | poetry | pip | cargo | go | ...>.
  Main source folder: <src/ | app/ | services/ | ...>.
  Tests folder: <tests/ | test/ | __tests__/ | ...>.
  Default endpoint: <URL or leave blank if not applicable>.
  Architecture:
    - <main component 1>.
    - <main component 2>.
    - <important responsibility boundary>.
    - <main communication flow or protocol if applicable>.
    - <how the system represents errors or partial failure if applicable>.
  Safety:
    - <most important safety constraint>.
    - <forbidden behavior if applicable>.
    - <how credentials or secrets must be handled>.
    - <required response, log, or error fields if applicable>.

rules:
  proposal:
    - State whether the change is a new feature, bug fix, refactor, integration, migration, or docs-only change.
    - List clear non-goals to avoid scope creep.
    - Name the affected components, such as API, UI, worker, DB, queue, MCP tools, bridge, or related modules.
  specs:
    - Write a clear golden-path scenario.
    - Add scenarios for the main failure mode, important edge cases, or partial failure when relevant.
    - If responses or errors require specific fields, show them in examples.
    - If the change touches security, permissions, money, real data, or destructive behavior, specify validation and confirmation requirements before implementation.
  design:
    - Keep the design simple and aligned with the existing architecture.
    - Only introduce abstractions when there is a clear responsibility boundary.
    - Describe where the change belongs and why.
    - Describe error handling, incomplete states, or fallback behavior only when they matter.
  tasks:
    - Break work into small verifiable steps.
    - Keep tasks surgical and directly tied to the requested change.
    - Include the appropriate test command for the repo's stack.
    - Include config or documentation updates only when they are directly needed.
